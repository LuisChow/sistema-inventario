<div class="form-container">
  <h3 class="form-header" style="cursor: default; padding-bottom: 10px; border-bottom: 1px solid var(--border);">
    <span>➕ Ingresar Nuevo Producto</span>
  </h3>
  
  <div class="form-grid" style="margin-top: 15px;">
    <div class="input-group">
      <label>Codigo del Producto</label>
      <input type="text" [(ngModel)]="nuevoProducto.codigo" placeholder="Ej. TUB-012">
    </div>

    <div class="input-group">
      <label>Nombre / Descripcion</label>
      <input type="text" [(ngModel)]="nuevoProducto.nombre" placeholder="Ej. Filtro secador">
    </div>

    <div class="input-group">
      <label>Categoria</label>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <select [(ngModel)]="nuevoProducto.categoria" style="flex: 1; min-width: 0;">
          @for (cat of inventoryService.categorias; track cat) { <option [value]="cat">{{cat}}</option> }
        </select>
        
        <!-- Boton modificado para abrir el modal HTML -->
        <button (click)="abrirModalEliminarCat()" title="Eliminar Categoria" style="background-color: #f44336; color: white; border: none; width: 42px; height: 42px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          ❌
        </button>
      </div>
      
      <div style="display: flex; gap: 8px;">
        <input type="text" [(ngModel)]="nuevaCatTexto" placeholder="Nueva categoria..." style="flex: 1; min-width: 0;">
        <button (click)="agregarCat()" title="Crear Categoria" style="background-color: var(--accent); color: white; border: none; width: 42px; height: 42px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;">
          ➕
        </button>
      </div>
    </div>

    <div class="input-group">
      <label>Cantidad Inicial</label>
      <input type="number" [(ngModel)]="nuevoProducto.cantidad" min="1">
    </div>
    <div class="input-group">
      <label>Precio Compra ($)</label>
      <input type="number" [(ngModel)]="nuevoProducto.precioCompra" min="0" step="0.5">
    </div>
    <div class="input-group">
      <label>Precio Venta ($)</label>
      <input type="number" [(ngModel)]="nuevoProducto.precioVenta" min="0" step="0.5">
    </div>

    <div class="input-group button-group">
      <button (click)="guardarProducto()" style="width: 100%;">Guardar Producto</button>
    </div>
  </div>
</div>

<!-- MODAL DE CONFIRMACION PARA ELIMINAR -->
@if (categoriaAEliminar) {
  <div class="modal-overlay">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <h3 style="margin-top:0;">🗑️ Eliminar Categoria</h3>
      <p style="font-size: 1.1rem;">¿Estas seguro de que deseas eliminar la categoria <strong style="color:var(--accent)">"{{ categoriaAEliminar }}"</strong>?</p>
      
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="btn-cancel" (click)="categoriaAEliminar = null" style="padding: 10px 20px;">Cancelar</button>
        <button class="btn-process" (click)="ejecutarEliminarCat()" style="padding: 10px 20px; background-color: #f44336;">❌ Eliminar</button>
      </div>
    </div>
  </div>
}
